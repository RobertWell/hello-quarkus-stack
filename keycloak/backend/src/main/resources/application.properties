quarkus.http.port=8124
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:8124
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-max-age=3600

# OIDC Configuration  
quarkus.oidc.auth-server-url=http://localhost:8081/realms/master
quarkus.oidc.client-id=hello-quarkus2
quarkus.oidc.credentials.secret=HYKtf0221pI09pBajxjaTKBdwSx1E9kZ
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.session-age-extension=30M
quarkus.oidc.authentication.java-script-auto-redirect=false

# Session encryption configuration
quarkus.oidc.token-state-manager.encryption-secret=my-secret-key-for-encryption-32-chars

# Security configuration - health check permitted, other routes require auth
quarkus.http.auth.permission.health.paths=/actuator/health
quarkus.http.auth.permission.health.policy=permit

quarkus.http.auth.permission.api-public.paths=/api/hello,/api/auth/login,/api/auth/logout
quarkus.http.auth.permission.api-public.policy=permit

quarkus.http.auth.permission.oidc.paths=/q/oidc/*
quarkus.http.auth.permission.oidc.policy=permit

quarkus.http.auth.permission.protected.paths=/*
quarkus.http.auth.permission.protected.policy=authenticated